[project]
name = "clouds"
version = "0.1.0"
description = "A collection of PyG compatible datasets"
readme = "README.md"
authors = [
    { name = "Jackson Campolattaro", email = "jackson.campolattaro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.6.0",
    "torch-geometric>=2.6.1",
    "gdown>=5.2.0",
    "h5py==3.14.0",
    "rich>=14.2.0",
    "tfrecord>=1.14.6",
    "laspy>=2.7.0",
]

[dependency-groups]
# The project itself only requires `torch>=2.6.0` (see `[project.dependencies]`)
# so that `clouds` stays installable against older PyTorch/PyG stacks. The dev
# group pins the accelerator stack this project is actually developed against
# (PyTorch 2.12 + CUDA 13), which also has to match the prebuilt `pyg-lib`
# wheels exposed by the PyG index in `uv.toml`.
dev = [
    "polyscope>=2.6.1",
    "pyg-lib>=0.8.0",
    "pykeops>=2.3",
    "pynanoflann>=0.10.0",
    "pytest>=9.1.1",
    "torch~=2.12.0",
    "torch-fpsample",
    "vpsample",
]

# Only git sources live here: both packages are dev-only (so they never enter a
# consumer's resolution), unlike `torch`/`pyg-lib`. The PyG index and the extra
# build dependencies are configured in `uv.toml`, because a package's
# `[tool.uv]` (including `sources`/`index`) is otherwise inherited by projects
# that consume it as a dependency.
[tool.uv.sources]
torch-fpsample = { git = "https://github.com/leonardodalinky/pytorch_fpsample", rev = "be93a08" }
vpsample = { git = "https://github.com/JacksonCampolattaro/vpsample.git", rev = "2f0890b" }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 128

[tool.ruff.lint]
select = [
    "RUF",
    "I", # isort
    "E", # pycodestyle
    "F", # pyflakes
    "FLY", # flynt
    "B", # bugbear
    "SIM", # simplify
]
exclude = [
    # "UP", # pyupgrade is currently incompatible with PyG's reflection
    "Q", # I have my own preferences for quotes
]

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"

[tool.ty.rules]
possibly-unbound-attribute = "ignore"
